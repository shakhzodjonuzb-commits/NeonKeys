
name: Android CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # OLD WORKING SDK CONFIGURATION — UNCHANGED
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Build project
        run: ./gradlew --no-daemon clean build

      # Find and collect APK files
      - name: Collect APK files
        shell: bash
        run: |
          mkdir -p artifacts/debug artifacts/release

          while IFS= read -r -d '' apk; do
            module="${apk%%/build/outputs/apk/*}"
            module="${module##*/}"
            filename="${module}-$(basename "$apk")"

            case "$apk" in
              */debug/*)
                cp "$apk" "artifacts/debug/$filename"
                ;;
              */release/*)
                cp "$apk" "artifacts/release/$filename"
                ;;
            esac
          done < <(
            find . -type f \
              -path '*/build/outputs/apk/*' \
              -name '*.apk' -print0
          )

          echo "DEBUG APK:"
          ls -lh artifacts/debug/

          echo "RELEASE APK:"
          ls -lh artifacts/release/

          test -n "$(find artifacts/debug -name '*.apk' -print -quit)"
          test -n "$(find artifacts/release -name '*.apk' -print -quit)"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: debug-apk
          path: artifacts/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v7
        with:
          name: release-apk
          path: artifacts/release/*.apk
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download Release APK
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: release-apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-apk/*.apk
          generate_release_notes: true
          fail_on_unmatched_files: true
