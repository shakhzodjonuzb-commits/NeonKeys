workflows:
  android-workflow:
    name: Build NeonKeys APK
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 21
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: main
          include: true
        - pattern: master
          include: true
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Build Android APK
        script: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
    artifacts:
      - app/build/outputs/**/*.apk
